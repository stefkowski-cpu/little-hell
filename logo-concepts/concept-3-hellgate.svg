<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0808"/>
      <stop offset="100%" stop-color="#1a0505"/>
    </linearGradient>
    <radialGradient id="hellglow" cx="0.5" cy="0.65" r="0.35">
      <stop offset="0%" stop-color="#ff4400" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#cc1100" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#880800" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4b060"/>
      <stop offset="100%" stop-color="#8a6830"/>
    </linearGradient>
    <linearGradient id="dieface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#e8d8b8"/>
    </linearGradient>
    <filter id="fireglow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg3)"/>
  <!-- Art Deco border double line -->
  <rect x="20" y="20" width="472" height="472" rx="76" fill="none" stroke="#c8a45a" stroke-width="3"/>
  <rect x="30" y="30" width="452" height="452" rx="68" fill="none" stroke="#c8a45a" stroke-width="1" opacity="0.4"/>
  <!-- Hell glow behind arch -->
  <ellipse cx="256" cy="310" rx="140" ry="120" fill="url(#hellglow)"/>
  <!-- Art Deco arch / gateway -->
  <path d="M150,410 L150,200 Q150,110 256,100 Q362,110 362,200 L362,410"
        fill="none" stroke="url(#arch)" stroke-width="8" stroke-linecap="round"/>
  <!-- Keystone -->
  <polygon points="256,92 270,108 242,108" fill="#d4b060"/>
  <!-- Inner arch glow line -->
  <path d="M166,405 L166,206 Q166,126 256,116 Q346,126 346,206 L346,405"
        fill="none" stroke="#cc4400" stroke-width="2" opacity="0.4"/>
  <!-- Decorative Deco elements on arch -->
  <!-- Left column detail -->
  <rect x="143" y="240" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <rect x="143" y="260" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <rect x="143" y="280" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <!-- Right column detail -->
  <rect x="355" y="240" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <rect x="355" y="260" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <rect x="355" y="280" width="14" height="4" rx="1" fill="#c8a45a" opacity="0.5"/>
  <!-- Two dice tumbling through the gate -->
  <!-- Die 1 - larger, foreground -->
  <g transform="translate(230, 290) rotate(-20)">
    <rect x="-40" y="-40" width="80" height="80" rx="14" fill="url(#dieface)" stroke="#b0985a" stroke-width="2"/>
    <!-- showing 6 -->
    <circle cx="-20" cy="-22" r="8" fill="#1a0808"/>
    <circle cx="-20" cy="0" r="8" fill="#1a0808"/>
    <circle cx="-20" cy="22" r="8" fill="#1a0808"/>
    <circle cx="20" cy="-22" r="8" fill="#1a0808"/>
    <circle cx="20" cy="0" r="8" fill="#1a0808"/>
    <circle cx="20" cy="22" r="8" fill="#1a0808"/>
  </g>
  <!-- Die 2 - smaller, behind, partially in the gate -->
  <g transform="translate(300, 250) rotate(15)">
    <rect x="-30" y="-30" width="60" height="60" rx="10" fill="url(#dieface)" stroke="#b0985a" stroke-width="2" opacity="0.85"/>
    <!-- showing 1 -->
    <circle cx="0" cy="0" r="8" fill="#cc2200"/>
  </g>
  <!-- Flame wisps from gate bottom -->
  <g filter="url(#fireglow)" opacity="0.6">
    <path d="M220,400 Q225,370 230,385 Q235,360 240,380 Q242,355 248,375 L248,410Z" fill="#ee4400"/>
    <path d="M264,405 Q268,375 272,390 Q276,365 280,382 Q284,360 288,378 L288,410Z" fill="#ee4400"/>
  </g>
  <!-- Top decoration - Art Deco fan -->
  <g transform="translate(256, 68)" stroke="#c8a45a" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="0" y1="0" x2="-30" y2="-20"/>
    <line x1="0" y1="0" x2="-15" y2="-24"/>
    <line x1="0" y1="0" x2="0" y2="-26"/>
    <line x1="0" y1="0" x2="15" y2="-24"/>
    <line x1="0" y1="0" x2="30" y2="-20"/>
  </g>
  <!-- Text -->
  <text x="256" y="460" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="bold" fill="#c8a45a" letter-spacing="6">LITTLE HELL</text>
  <!-- Decorative underline -->
  <line x1="130" y1="472" x2="382" y2="472" stroke="#c8a45a" stroke-width="1" opacity="0.4"/>
</svg>