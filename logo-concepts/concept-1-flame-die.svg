<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="100%" stop-color="#0d0505"/>
    </linearGradient>
    <linearGradient id="fire1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cc2200"/>
      <stop offset="40%" stop-color="#ee6600"/>
      <stop offset="80%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#fff4a0"/>
    </linearGradient>
    <linearGradient id="die1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f0e0"/>
      <stop offset="100%" stop-color="#d4c9a8"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg1)"/>
  <!-- Art Deco border -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#c8a45a" stroke-width="4"/>
  <rect x="28" y="28" width="456" height="456" rx="72" fill="none" stroke="#c8a45a" stroke-width="1.5" opacity="0.5"/>
  <!-- Flames behind die -->
  <g filter="url(#glow1)" opacity="0.9">
    <!-- Center flame -->
    <path d="M256 120 Q270 180 256 210 Q280 170 290 200 Q295 160 310 190 Q300 140 280 110 Q270 140 256 120Z" fill="url(#fire1)" opacity="0.8"/>
    <!-- Left flame -->
    <path d="M200 180 Q215 220 210 250 Q225 215 235 240 Q230 200 220 170 Q210 195 200 180Z" fill="url(#fire1)" opacity="0.7"/>
    <!-- Right flame -->
    <path d="M310 170 Q325 210 318 245 Q335 210 340 235 Q338 195 325 165 Q318 188 310 170Z" fill="url(#fire1)" opacity="0.7"/>
    <!-- Wide left -->
    <path d="M170 210 Q185 240 180 260 Q195 235 200 255 Q196 225 188 205 Q180 220 170 210Z" fill="url(#fire1)" opacity="0.5"/>
    <!-- Wide right -->
    <path d="M340 200 Q355 235 348 258 Q362 230 365 250 Q360 220 350 200 Q345 215 340 200Z" fill="url(#fire1)" opacity="0.5"/>
  </g>
  <!-- Die body - slightly rotated for dynamism -->
  <g transform="translate(256, 290) rotate(-12)">
    <!-- Shadow -->
    <rect x="-78" y="-68" width="156" height="156" rx="24" fill="#000" opacity="0.4" transform="translate(6,8)"/>
    <!-- Die face -->
    <rect x="-78" y="-78" width="156" height="156" rx="24" fill="url(#die1)" stroke="#b8a070" stroke-width="3"/>
    <!-- Pips showing 6 -->
    <circle cx="-38" cy="-40" r="14" fill="#1a0a0a"/>
    <circle cx="-38" cy="0" r="14" fill="#1a0a0a"/>
    <circle cx="-38" cy="40" r="14" fill="#1a0a0a"/>
    <circle cx="38" cy="-40" r="14" fill="#1a0a0a"/>
    <circle cx="38" cy="0" r="14" fill="#1a0a0a"/>
    <circle cx="38" cy="40" r="14" fill="#1a0a0a"/>
  </g>
  <!-- Text "LITTLE HELL" arc style -->
  <text x="256" y="445" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="#c8a45a" letter-spacing="8">LITTLE HELL</text>
  <!-- Decorative Art Deco lines -->
  <line x1="80" y1="420" x2="160" y2="420" stroke="#c8a45a" stroke-width="2" opacity="0.6"/>
  <line x1="352" y1="420" x2="432" y2="420" stroke="#c8a45a" stroke-width="2" opacity="0.6"/>
  <polygon points="165,420 172,416 172,424" fill="#c8a45a" opacity="0.6"/>
  <polygon points="347,420 340,416 340,424" fill="#c8a45a" opacity="0.6"/>
</svg>