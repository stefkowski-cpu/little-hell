<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="100%" stop-color="#0e0904"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d060"/>
      <stop offset="50%" stop-color="#c8a030"/>
      <stop offset="100%" stop-color="#a07820"/>
    </linearGradient>
    <linearGradient id="redglow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#cc2200"/>
      <stop offset="100%" stop-color="#881100" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <!-- Subtle red glow from bottom -->
  <rect width="512" height="256" y="256" rx="0" fill="url(#redglow)" opacity="0.3"/>
  <!-- Art Deco octagonal frame -->
  <polygon points="256,36 420,108 476,272 420,436 256,508 92,436 36,272 92,108" fill="none" stroke="url(#gold2)" stroke-width="4"/>
  <polygon points="256,52 408,118 460,272 408,426 256,492 104,426 52,272 104,118" fill="none" stroke="#c8a45a" stroke-width="1" opacity="0.3"/>
  <!-- Radiating Deco lines from center -->
  <g stroke="#c8a45a" stroke-width="1" opacity="0.15">
    <line x1="256" y1="60" x2="256" y2="160"/>
    <line x1="396" y1="125" x2="330" y2="190"/>
    <line x1="116" y1="125" x2="182" y2="190"/>
  </g>
  <!-- Central die shape as diamond -->
  <g transform="translate(256, 240) rotate(45)">
    <rect x="-60" y="-60" width="120" height="120" rx="12" fill="none" stroke="url(#gold2)" stroke-width="5"/>
    <!-- Single pip = 1 (the "Hell" in Little Hell, snake eyes) -->
    <circle cx="0" cy="0" r="16" fill="url(#gold2)"/>
  </g>
  <!-- "LH" Monogram -->
  <g transform="translate(256, 248)">
    <!-- L -->
    <path d="M-68,-55 L-68,55 L-20,55" fill="none" stroke="url(#gold2)" stroke-width="10" stroke-linecap="square"/>
    <!-- H -->
    <path d="M12,-55 L12,55 M12,0 L68,0 M68,-55 L68,55" fill="none" stroke="url(#gold2)" stroke-width="10" stroke-linecap="square"/>
  </g>
  <!-- Small decorative diamonds -->
  <polygon points="256,80 264,92 256,104 248,92" fill="#c8a45a" opacity="0.6"/>
  <polygon points="256,390 264,402 256,414 248,402" fill="#c8a45a" opacity="0.6"/>
  <!-- Text -->
  <text x="256" y="468" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#c8a45a" letter-spacing="12" opacity="0.8">LITTLE HELL</text>
</svg>